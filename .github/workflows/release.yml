name: Release

# v で始まるタグを打つと、3 OS の成果物を作って GitHub Releases の下書きへ
# 添付する（設計書 13 編 §13.8）。- を含むタグ（v1.0.0-rc.1 など）は
# プレリリースとする。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS（.app と .dmg）
    needs: test
    runs-on: macos-latest
    env:
      SHOGUN_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: arm64 と amd64 をビルドする
        shell: bash
        run: |
          GOARCH=arm64 tools/build.sh
          CGO_ENABLED=1 GOARCH=amd64 tools/build.sh
      - name: ユニバーサルバイナリ・.app・.dmg を作る
        run: >
          go run ./tools/package macos -version "$SHOGUN_VERSION"
          -arm64 dist/darwin_arm64/shogun -amd64 dist/darwin_amd64/shogun -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}（.msi と .zip）
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      SHOGUN_VERSION: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Fyne は cgo を使う。arm64 のランナーには C コンパイラを入れる
      - uses: msys2/setup-msys2@v2
        if: matrix.arch == 'arm64'
        with:
          msystem: CLANGARM64
          install: mingw-w64-clang-aarch64-clang
          path-type: inherit
      - name: ビルドする（リソースの生成を含む）
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PATH="/c/msys64/clangarm64/bin:$PATH" CC=clang
          fi
          GOARCH=${{ matrix.arch }} tools/build.sh
      # .msi は WiX Toolset v5 で作る（設計書 13 編 §13.6）。v6 以降は使わない
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: WiX Toolset v5 を導入する
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add --global WixToolset.UI.wixext/5.0.2
      - name: .msi と .zip を作る
        run: >
          go run ./tools/package windows -version "$SHOGUN_VERSION" -arch ${{ matrix.arch }}
          -bin dist/windows_${{ matrix.arch }}/shogun.exe -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}（.deb・.rpm・AppImage・.tar.gz）
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            appimage: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage: aarch64
    env:
      SHOGUN_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 依存パッケージを導入する
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxxf86vm-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libasound2-dev file
      - name: appimagetool を取得する
        run: |
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage"
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
      - name: ビルドする
        run: GOARCH=${{ matrix.arch }} tools/build.sh
      - name: .deb・.rpm・AppImage・.tar.gz を作る
        # ランナーに FUSE が無いため、appimagetool を展開して実行する
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >
          go run ./tools/package linux -version "$SHOGUN_VERSION" -arch ${{ matrix.arch }}
          -bin dist/linux_${{ matrix.arch }}/shogun -out dist -appimage
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: リリースの下書き
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # リリースノート（docs/releases/<タグ>.md）を読むために取得する
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: チェックサムとリリースノートを作る
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          v="${TAG#v}"
          notes="repo/docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            cat "$notes" > notes.md
          else
            printf '## Shogun Emulator %s\n\n### 変更点\n\n- （ここに変更点を書く）\n' "$TAG" > notes.md
          fi
          cat >> notes.md <<NOTES

          ## ダウンロード / Downloads

          | OS | インストーラ / Installer | そのほか / Others |
          |---|---|---|
          | macOS 11+（Apple シリコン・Intel） | \`Shogun_Emulator-${TAG}-macos.dmg\` | |
          | Windows 10+（x64） | \`Shogun_Emulator-${TAG}-windows-x64.msi\` | \`shogun-emulator-${TAG}-windows-amd64.zip\` |
          | Windows 10+（Arm64） | \`Shogun_Emulator-${TAG}-windows-arm64.msi\` | \`shogun-emulator-${TAG}-windows-arm64.zip\` |
          | Linux x86-64（Debian・Ubuntu） | \`shogun-emulator_${v}-1_amd64.deb\` | \`Shogun_Emulator-${TAG}-x86_64.AppImage\`、\`shogun-emulator-${TAG}-linux-amd64.tar.gz\` |
          | Linux x86-64（Fedora・RHEL・openSUSE） | \`shogun-emulator-${v}-1.x86_64.rpm\` | |
          | Linux arm64（Debian・Ubuntu） | \`shogun-emulator_${v}-1_arm64.deb\` | \`Shogun_Emulator-${TAG}-aarch64.AppImage\`、\`shogun-emulator-${TAG}-linux-arm64.tar.gz\` |
          | Linux arm64（Fedora・RHEL・openSUSE） | \`shogun-emulator-${v}-1.aarch64.rpm\` | |

          署名と公証をしていないため、初回の起動で macOS の Gatekeeper と Windows の SmartScreen の警告が出ます。回避の手順は同梱の \`USAGE.md\` にあります。
          The binaries are not signed or notarized, so macOS Gatekeeper and Windows SmartScreen show a warning on first launch. See the bundled \`USAGE.md\` for how to open the app.

          各ファイルの SHA-256 は \`SHA256SUMS.txt\` にあります。 / SHA-256 checksums are in \`SHA256SUMS.txt\`.
          NOTES
      - name: 下書きを作る
        run: |
          flags="--draft"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" $flags --repo "$GITHUB_REPOSITORY" \
            --title "Shogun Emulator $TAG" --notes-file notes.md assets/*
